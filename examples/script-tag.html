<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>One-line script — Money Visualiser embed</title>
  </head>
  <body>
    <!--
      The official one-line embed. It always draws a single stack on a pallet in the
      gold vault, sized 16:9 up to 800 px wide. For any other scene, use an iframe.
    -->
    <script
      src="https://moneyvisualiser.com/embed.js"
      data-mv-widget
      data-amount="250000"
      data-currency="GBP"
      data-zoom="normal"
      data-show-stats="true"
      async></script>
  </body>
</html>
