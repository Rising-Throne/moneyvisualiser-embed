<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive — Money Visualiser embed</title>
    <style>
      /* Fills the column it sits in and keeps a 16:9 shape at any width. */
      .money-embed {
        width: 100%;
        max-width: 960px;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        background: #0b0e11;
      }
      .money-embed iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="money-embed">
      <iframe
        src="https://moneyvisualiser.com/embed/render?amount=1000000000&from=USD&mode=single&env=football-field&surface=pallet"
        title="What 1,000,000,000 USD looks like, in 3D"
        loading="lazy">
      </iframe>
    </div>
  </body>
</html>
