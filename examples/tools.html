<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tools — Money Visualiser embeds</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
      iframe { display: block; margin: 0.75rem 0 2.5rem; }
    </style>
  </head>
  <body>
    <!-- Each tool opens in its default state; readers set their own figures inside it. -->
    <h2>What Does X Look Like?</h2>
    <iframe src="https://moneyvisualiser.com/tools/what-does-x-look-like/embed"
      style="width:100%;height:600px;border:none;border-radius:12px"
      title="What Does X Look Like?" loading="lazy"></iframe>

    <h2>Cash Stack Calculator</h2>
    <iframe src="https://moneyvisualiser.com/tools/cash-stack-calculator/embed"
      style="width:100%;height:600px;border:none;border-radius:12px"
      title="Cash Stack Calculator" loading="lazy"></iframe>

    <h2>Denomination Mix Optimizer</h2>
    <iframe src="https://moneyvisualiser.com/tools/denomination-mix-optimizer/embed"
      style="width:100%;height:600px;border:none;border-radius:12px"
      title="Denomination Mix Optimizer" loading="lazy"></iframe>

    <h2>Carryability Planner</h2>
    <iframe src="https://moneyvisualiser.com/tools/carryability-planner/embed"
      style="width:100%;height:600px;border:none;border-radius:12px"
      title="Carryability Planner" loading="lazy"></iframe>

    <h2>Value Density Index</h2>
    <iframe src="https://moneyvisualiser.com/tools/value-density-index/embed"
      style="width:100%;height:600px;border:none;border-radius:12px"
      title="Value Density Index" loading="lazy"></iframe>
  </body>
</html>
