<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two currencies side by side — Money Visualiser embed</title>
  </head>
  <body>
    <!-- Compare mode is the default: 50,000 euros beside the same value in Japanese yen. -->
    <iframe
      src="https://moneyvisualiser.com/embed/render?amount=50000&from=EUR&to=JPY&camera=diagonal"
      width="640"
      height="480"
      title="50,000 EUR compared with JPY, in 3D"
      loading="lazy"
      style="border: 0; border-radius: 12px;">
    </iframe>
  </body>
</html>
