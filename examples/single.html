<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>One stack — Money Visualiser embed</title>
  </head>
  <body>
    <!-- One million US dollars as a single stack on a pallet in the warehouse. -->
    <iframe
      src="https://moneyvisualiser.com/embed/render?amount=1000000&from=USD&mode=single&env=warehouse&surface=pallet&stats=true"
      width="640"
      height="480"
      title="What 1,000,000 USD looks like, in 3D"
      loading="lazy"
      style="border: 0; border-radius: 12px;">
    </iframe>
  </body>
</html>
